              - { name: detail, label: "Extra info", type: string }
              - { name: price, label: "Price", type: string }
          - { name: note, label: "Small note under the prices", type: text }
          - { name: cta_heading, label: "Closing heading", type: string }
          - { name: cta_text, label: "Closing text", type: text }
          - { name: cta_button, label: "Button text", type: string }
