# Pages CMS – dashboard for quadrupple.art
# Log in at https://app.pagescms.org with your GitHub account and open this repository.
# One group per language. Change a text in each language you want to update.
media:
  input: images
  output: images
content:
- name: lang-en
  label: English
  type: group
  items:
  - name: site-en
    label: Main page
    type: file
    path: content/site.json
    format: json
    fields:
    - name: brand
      label: Brand name
      type: string
    - name: slogan
      label: Slogan lines
      type: object
      list: true
      fields:
      - name: big
        label: Big word
        type: string
      - name: rest
        label: Rest of the line
        type: string
    - name: hero_images
      label: 'Opening: photo to oil painting (in order)'
      type: object
      list: true
      fields:
      - name: image
        label: Image
        type: image
      - name: stage
        label: Label at the bottom
        type: string
    - name: song
      label: Song (mp3)
      type: file
    - name: song_button
      label: Music button text
      type: string
    - name: song_button_off
      label: Music button text while playing
      type: string
    - name: welcome
      label: Welcome
      type: object
      fields:
      - name: label
        label: Small label
        type: string
      - name: heading
        label: Heading
        type: string
      - name: text
        label: Text
        type: text
      - name: question
        label: Question underneath
        type: string
    - name: walk
      label: 'The walk: one card per craft (in order)'
      type: object
      list: true
      fields:
      - name: image
        label: Painting behind the card
        type: image
      - name: label
        label: Small label (number · category)
        type: string
      - name: title
        label: Title
        type: string
      - name: subtitle
        label: Subtitle (handwritten)
        type: string
      - name: text
        label: Text
        type: text
      - name: rows
        label: Price list (optional)
        type: object
        list: true
        fields:
        - name: name
          label: Product
          type: string
        - name: detail
          label: Extra info
          type: string
        - name: price
          label: Price
          type: string
      - name: price
        label: Price
        type: string
      - name: button
        label: Button text (empty = no button)
        type: string
      - name: email_subject
        label: E-mail subject
        type: string
      - name: page
        label: Detail page
        type: select
        options:
          values:
          - ''
          - leather
          - charcoal
          - cooking
          - books
          - tattoo
          - business-plan
          - consultancy
          - marketing
      - name: page_link
        label: Link text to the detail page
        type: string
      - name: dark
        label: Dark card
        type: boolean
    - name: quote
      label: Closing by the fire
      type: object
      fields:
      - name: image
        label: Painting
        type: image
      - name: label
        label: Small label
        type: string
      - name: text
        label: Quote
        type: text
      - name: word
        label: Last word
        type: string
    - name: contact
      label: Contact
      type: object
      fields:
      - name: label
        label: Small label
        type: string
      - name: heading
        label: Heading
        type: string
      - name: text
        label: Text
        type: text
      - name: email
        label: E-mail address
        type: string
      - name: whatsapp
        label: WhatsApp number (with country code, e.g. +34 600 000 000)
        type: string
      - name: crypto
        label: Crypto line
        type: string
    - name: footer
      label: Footer line
      type: string
    - name: ui
      label: Small texts (buttons, language)
      type: object
      fields:
      - name: back
        label: '"Back to the farm" link'
        type: string
      - name: scroll
        label: '"Scroll" hint'
        type: string
      - name: photo
        label: Word on empty photo boxes
        type: string
      - name: lang
        label: Word "Language" (for screen readers)
        type: string
