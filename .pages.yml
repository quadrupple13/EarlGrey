          - { name: label, label: "Small label (number · category)", type: string }
          - { name: title, label: "Title", type: string }
          - { name: subtitle, label: "Subtitle (handwritten)", type: string }
          - { name: image, label: "Big painting at the top", type: image }
          - { name: image_alt, label: "Description of the painting (for the blind)", type: string }
          - { name: intro, label: "Introduction", type: text }
          - { name: more, label: "Second paragraph", type: text }
          - { name: steps_heading, label: "Heading above the steps", type: string }
          - name: steps
            label: "Steps"
            type: object
            list: true
            fields:
              - { name: title, label: "Title", type: string }
              - { name: text, label: "Text", type: text }
          - { name: gallery_heading, label: "Heading above the photos", type: string }
          - name: photos
            label: "Photos of your work"
            type: object
            list: true
            fields:
              - { name: image, label: "Photo", type: image }
              - { name: caption, label: "Caption", type: string }
          - { name: prices_heading, label: "Heading above the prices", type: string }
          - name: prices
            label: "Prices"
            type: object
            list: true
            fields:
